[package]
name = "open-rvt"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "open_rvt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# Actualizador (desactivado): cuando se active hará falta tauri-plugin-updater, el
# endpoint de actualizaciones y su llave pública. Ahora no hay ninguno de los tres.
log = "0.4"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
