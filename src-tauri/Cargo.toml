[package]
name = "open-rvt"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "open_rvt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# O005c: actualizador automático del canal propio (Windows) y relanzado tras instalar.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# O005c: consulta nativa del latest.json en Linux (el WebView no puede por CORS).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# O006c: nombre de archivo de la bitácora y sello de tiempo ISO con milisegundos.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# O006c: exportación de la bitácora en .zip.
zip = { version = "4", default-features = false, features = ["deflate"] }
log = "0.4"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
# O018: escucha nativa de gestos (WM_GESTURE, WM_POINTER, rueda y toques).
# Misma versión que ya trae webview2-com; no debe bajar crates nuevos.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Input_Touch",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
