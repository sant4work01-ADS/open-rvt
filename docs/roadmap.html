<title>OPEN-RVT — Roadmap</title>
<style>
:root{--fondo:#14171c;--panel:#1d2128;--linea:#2c323c;--texto:#e6e8eb;--tenue:#8b93a1;--hoy:#ff5d5d;
--f0:#7f8c9d;--f1:#5fb36b;--f2:#d9a441;--f3:#4f8fd6;--f4:#c96fd1;--f5:#3fb8b0;--f6:#e0694f;--mvp:#f2d34b}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--fondo);color:var(--texto)}
header{padding:18px 24px;border-bottom:1px solid var(--linea);display:flex;gap:24px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.sub{color:var(--tenue);font-size:13px}
.kpis{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}
.kpi{background:var(--panel);border:1px solid var(--linea);border-radius:8px;padding:8px 14px;min-width:110px}
.kpi b{display:block;font-size:20px}
.kpi span{color:var(--tenue);font-size:12px}
.barra-total{height:8px;background:#2a2f38;border-radius:4px;overflow:hidden;margin-top:6px}
.barra-total i{display:block;height:100%;background:linear-gradient(90deg,var(--f1),var(--mvp))}
nav{display:flex;gap:8px;padding:10px 24px;border-bottom:1px solid var(--linea);flex-wrap:wrap}
nav button{background:var(--panel);color:var(--texto);border:1px solid var(--linea);border-radius:6px;padding:6px 12px;cursor:pointer}
nav button.activo{border-color:var(--mvp);color:var(--mvp)}
main{padding:16px 24px}
.gantt{display:grid;grid-template-columns:330px 1fr;border:1px solid var(--linea);border-radius:8px;overflow:hidden;background:var(--panel)}
.col-izq{border-right:1px solid var(--linea)}
.cab{height:46px;border-bottom:1px solid var(--linea);display:flex;align-items:flex-end;padding:0 10px 6px;color:var(--tenue);font-size:12px}
.fila{height:40px;border-bottom:1px solid var(--linea);display:flex;align-items:center;padding:0 10px;gap:8px;cursor:pointer}
.fila:hover{background:#252a33}
.fase-titulo{height:30px;background:#191c22;border-bottom:1px solid var(--linea);display:flex;align-items:center;padding:0 10px;font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.id{font-family:ui-monospace,Consolas,monospace;color:var(--tenue);font-size:12px;width:44px}
.nombre{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.estado{font-size:11px;padding:2px 7px;border-radius:10px;border:1px solid}
.e-hecho{color:#7bd389;border-color:#3d6b45}
.e-curso{color:#ffd166;border-color:#7a6430}
.e-pend{color:var(--tenue);border-color:var(--linea)}
.e-futuro{color:#9aa6ff;border-color:#3e4680}
.col-der{overflow-x:auto;position:relative}
.lienzo{position:relative}
.semanas{display:flex;height:46px;border-bottom:1px solid var(--linea)}
.semana{border-right:1px solid var(--linea);font-size:11px;color:var(--tenue);padding:4px 6px;flex:none}
.semana b{display:block;color:var(--texto);font-size:12px}
.pista{height:40px;border-bottom:1px solid var(--linea);position:relative}
.pista.fase{height:30px;background:#191c22}
.bloque{position:absolute;top:9px;height:22px;border-radius:5px;overflow:hidden;box-shadow:0 1px 0 #0006;cursor:pointer}
.bloque .fondo{position:absolute;inset:0;opacity:.35}
.bloque .avance{position:absolute;top:0;bottom:0;left:0}
.bloque span{position:relative;font-size:11px;padding:0 6px;line-height:22px;white-space:nowrap;font-weight:600;text-shadow:0 1px 1px #0008}
.hito{position:absolute;top:10px;width:18px;height:18px;transform:rotate(45deg);background:var(--mvp);border:2px solid #0008}
.hoy{position:absolute;top:0;bottom:0;width:2px;background:var(--hoy);z-index:5}
.hoy::after{content:"hoy";position:absolute;top:2px;left:4px;color:var(--hoy);font-size:11px;font-weight:600}
.finde{position:absolute;top:46px;bottom:0;background:#ffffff06;pointer-events:none}
#detalle{margin-top:16px;background:var(--panel);border:1px solid var(--linea);border-radius:8px;padding:16px;display:none}
#detalle h2{margin:0 0 6px;font-size:17px}
#detalle .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:10px}
#detalle h3{font-size:12px;color:var(--tenue);text-transform:uppercase;margin:0 0 4px}
#detalle ul{margin:0;padding-left:18px}
.chip{display:inline-block;background:#2a2f38;border-radius:10px;padding:1px 8px;margin:2px;font-size:12px}
.chip.recicla{background:#203a2a;color:#9fe0ad}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0;color:var(--tenue);font-size:12px}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--linea);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--linea);vertical-align:top}
th{color:var(--tenue);font-weight:500;font-size:12px}
.mini{height:6px;background:#2a2f38;border-radius:3px;overflow:hidden;width:90px}
.mini i{display:block;height:100%}
.oculto{display:none}
footer{color:var(--tenue);font-size:12px;padding:10px 24px 30px}
</style>
</head>

  </div>
</header>

</main>

const DIA = 86400000, ANCHO_DIA = 28;
const f = s => new Date(s+"T00:00:00");
const ini0 = new Date(Math.min(...TAREAS.map(t=>f(t.ini))));
ini0.setDate(ini0.getDate() - ((ini0.getDay()+6)%7)); // lunes
const finMax = new Date(Math.max(...TAREAS.map(t=>f(t.fin))));
const dias = Math.ceil((finMax-ini0)/DIA)+8;
const x = d => Math.round((f(d)-ini0)/DIA)*ANCHO_DIA;
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmt = s => { const d=f(s); return d.getDate()+" "+MESES[d.getMonth()]; };
const ETQ = {hecho:"hecho",curso:"en curso",pend:"pendiente",futuro:"futuro"};

function kpis(){
  const mvp = TAREAS.filter(t=>t.fase!=="FX" && !t.hito);
  const pesos = mvp.map(t=>Math.max(1,(f(t.fin)-f(t.ini))/DIA+1));
  const tot = pesos.reduce((a,b)=>a+b,0);
  const av = mvp.reduce((a,t,i)=>a+t.avance*pesos[i],0)/tot;
  document.getElementById("k-avance").textContent = Math.round(av)+"%";
  document.getElementById("k-barra").style.width = av+"%";
  document.getElementById("k-hechas").textContent = mvp.filter(t=>t.estado==="hecho").length+" / "+mvp.length;
  document.getElementById("k-curso").textContent = mvp.filter(t=>t.estado==="curso").length;
  const h = TAREAS.find(t=>t.hito); document.getElementById("k-mvp").textContent = h?fmt(h.fin):"—";
  document.getElementById("actualizado").textContent = ACTUALIZADO;
}

function gantt(){
  const izq = document.getElementById("izq"), lz = document.getElementById("lienzo");
  izq.innerHTML = '<div class="cab">Tarea</div>'; lz.innerHTML = "";
  lz.style.width = (dias*ANCHO_DIA)+"px";
  const sem = document.createElement("div"); sem.className="semanas";
  for(let d=0; d<dias; d+=7){
    const dd = new Date(ini0.getTime()+d*DIA);
    const s = document.createElement("div"); s.className="semana"; s.style.width=(7*ANCHO_DIA)+"px";
    s.innerHTML = "<b>"+dd.getDate()+" "+MESES[dd.getMonth()]+"</b>semana "+(1+d/7);
    sem.appendChild(s);
    const fin = document.createElement("div"); fin.className="finde";
    fin.style.left=((d+5)*ANCHO_DIA)+"px"; fin.style.width=(2*ANCHO_DIA)+"px"; lz.appendChild(fin);
  }
  lz.appendChild(sem);
  for(const [fid,fase] of Object.entries(FASES)){
    const ts = TAREAS.filter(t=>t.fase===fid); if(!ts.length) continue;
    const ft = document.createElement("div"); ft.className="fase-titulo"; ft.style.color=fase.color;
    ft.textContent = fid+" · "+fase.nombre; izq.appendChild(ft);
    const fp = document.createElement("div"); fp.className="pista fase"; lz.appendChild(fp);
    for(const t of ts){
      const fila = document.createElement("div"); fila.className="fila";
      fila.innerHTML = `<span class="id">${t.id}</span><span class="nombre" title="${t.nombre}">${t.nombre}</span><span class="estado e-${t.estado}">${ETQ[t.estado]}</span>`;
      fila.onclick = ()=>detalle(t); izq.appendChild(fila);
      const p = document.createElement("div"); p.className="pista";
      if(t.hito){
        const h = document.createElement("div"); h.className="hito"; h.style.left=(x(t.ini)+ANCHO_DIA/2-9)+"px";
        h.title=t.nombre; h.onclick=()=>detalle(t); p.appendChild(h);
      } else {
        const b = document.createElement("div"); b.className="bloque";
        b.style.left = x(t.ini)+"px"; b.style.width = (x(t.fin)-x(t.ini)+ANCHO_DIA)+"px";
        b.innerHTML = `<div class="fondo" style="background:${fase.color}"></div><div class="avance" style="width:${t.avance}%;background:${fase.color}"></div><span>${t.avance}%</span>`;
        b.title = `${t.id} · ${fmt(t.ini)} → ${fmt(t.fin)}`; b.onclick=()=>detalle(t);
        p.appendChild(b);
      }
      lz.appendChild(p);
    }
  }
  const hoy = document.createElement("div"); hoy.className="hoy"; hoy.style.left=(x(HOY)+ANCHO_DIA/2)+"px"; lz.appendChild(hoy);
  document.getElementById("leyenda").innerHTML = Object.entries(FASES).map(([k,v])=>`<span><i style="background:${v.color}"></i>${k} ${v.nombre}</span>`).join("")
    + '<span><i style="background:var(--mvp);transform:rotate(45deg)"></i>hito</span><span><i style="background:#ffffff10"></i>fin de semana (carga pesada)</span>';
}

function detalle(t){
  const d = document.getElementById("detalle"); d.style.display="block";
  const deps = (t.dep||[]).map(id=>{const o=TAREAS.find(z=>z.id===id);return `<span class="chip">${id}${o?" · "+ETQ[o.estado]:""}</span>`}).join("") || "—";
  d.innerHTML = `<h2>${t.id} · ${t.nombre}</h2>
   <div class="sub">${FASES[t.fase].nombre} · ${fmt(t.ini)} → ${fmt(t.fin)} · <span class="estado e-${t.estado}">${ETQ[t.estado]}</span> · ${t.avance}%</div>
   <div class="grid">
    <div><h3>Entrega</h3><ul>${(t.entrega||[]).map(e=>`<li>${e}</li>`).join("")}</ul></div>
    <div><h3>Reutiliza del repo</h3>${(t.recicla||[]).map(r=>`<span class="chip recicla">${r}</span>`).join("")||"—"}</div>
    <div><h3>Depende de</h3>${deps}</div>
   </div>`;
  d.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function tabla(){
  const filas = TAREAS.map(t=>`<tr><td class="id">${t.id}</td><td>${t.nombre}<div class="sub">${(t.entrega||[]).join(" · ")}</div></td>
   <td>${FASES[t.fase].nombre}</td><td>${fmt(t.ini)} → ${fmt(t.fin)}</td>
   <td><span class="estado e-${t.estado}">${ETQ[t.estado]}</span></td>
   <td><div class="mini"><i style="width:${t.avance}%;background:${FASES[t.fase].color}"></i></div>${t.avance}%</td></tr>`).join("");
  document.getElementById("v-tabla").innerHTML = `<table><tr><th>ID</th><th>Tarea</th><th>Fase</th><th>Fechas</th><th>Estado</th><th>Avance</th></tr>${filas}</table>`;
}

function reciclado(){
  const mapa = {};
  for(const t of TAREAS) for(const r of (t.recicla||[])) (mapa[r] ||= []).push(t.id);
  const filas = Object.entries(mapa).map(([r,ids])=>`<tr><td><span class="chip recicla">${r}</span></td><td>${ids.map(i=>`<span class="chip">${i}</span>`).join("")}</td></tr>`).join("");
  document.getElementById("v-reciclado").innerHTML = `<p class="sub">Módulos y archivos del propio OPEN-RVT que cada tarea reutiliza, en vez de reescribirlos.</p>
   <table><tr><th>Pieza reutilizada</th><th>Tareas</th></tr>${filas}</table>`;
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(o=>o.classList.toggle("activo",o===b));
  for(const v of ["gantt","tabla","reciclado"]) document.getElementById("v-"+v).classList.toggle("oculto", v!==b.dataset.vista);
});
kpis(); gantt(); tabla(); reciclado();
</script>
