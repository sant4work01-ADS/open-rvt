[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrvt-nucleo"
version = "0.1.0"
description = "Núcleo IFC de OPEN-RVT basado en IfcOpenShell"
requires-python = ">=3.11"
dependencies = [
  "ifcopenshell==0.9.0.post1",
  "numpy",
  "shapely==2.2.0",
]

[project.optional-dependencies]
pruebas = ["pytest"]

[tool.setuptools]
packages = ["openrvt_nucleo", "openrvt_nucleo.modelado", "openrvt_nucleo.interacciones"]

[tool.pytest.ini_options]
testpaths = ["tests"]
